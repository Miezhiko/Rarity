terms:
  квадробер:
    definition: "Человек, который передвигается на четырех конечностях и имитирует поведение животных"
    description: "Квадроберы — это преимущественно молодежная субкультура, представители которой передвигаются на четвереньках и имитируют поведение животных. Участники носят маски, хвосты, уши и другие аксессуары, имитирующие различных животных (кошек, собак, лис, волков и др.). Квадроберы часто создают видеоконтент для социальных сетей, участвуют в тематических встречах и фестивалях. Субкультура включает элементы ролевых игр, творческого самовыражения и поиска идентичности среди подростков."
    category: "интернет_культура"
    related_terms: ["фури", "териан", "озёркин", "квадробика", "зооморфизм"]
    tags: ["субкультура", "идентичность", "движение", "поведение", "молодежь", "интернет", "ролевая_игра"]
    updated: "2025-09-09"

  квадробика:
    definition: "Практика передвижения на четвереньках с имитацией поведения животных"
    description: "Квадробика — это основная практика квадроберов, включающая специальные техники передвижения на четвереньках, имитацию звуков и повадок животных, использование специальных аксессуаров. Включает элементы физических упражнений, развития координации и гибкости. Многие практики квадробики рассматривают её как форму медитации, способ снятия стресса или творческого самовыражения."
    category: "практика"
    related_terms: ["квадробер", "зооморфное_поведение", "животная_имитация"]
    tags: ["практика", "движение", "физическая_активность", "имитация", "творчество"]
    updated: "2025-09-09"

  зооморфизм:
    definition: "Приписывание человеку животных форм, характеристик или поведения"
    description: "В контексте субкультур зооморфизм проявляется в стремлении людей принять животные черты через костюмы, поведение или духовную идентификацию. Это явление находит выражение в различных сообществах от квадроберов до териан."
    category: "концепт"
    related_terms: ["антропоморфный", "квадробер", "териан", "трансформация"]
    tags: ["концепция", "трансформация", "идентичность", "поведение"]
    updated: "2025-09-09"

  фури:
    definition: "Человек, интересующийся антропоморфными животными персонажами"
    description: "Фэндом фури (furry) — это международная субкультура, интересующаяся вымышленными антропоморфными персонажами с человеческими чертами и характеристиками. Участники часто создают фурсоны (fursonas), занимаются художественным творчеством, литературой, создают костюмы (фурсьюты). В России сообщество фури существует с начала 2000-х годов и включает тысячи участников различных возрастов."
    category: "интернет_культура"
    related_terms: ["фурсона", "антропоморфный", "квадробер", "фурсьют", "антро"]
    tags: ["фэндом", "субкультура", "искусство", "идентичность", "творчество", "сообщество"]
    updated: "2025-09-09"

  фурсьют:
    definition: "Костюм, изображающий антропоморфного животного персонажа"
    description: "Фурсьют — это специализированный костюм, созданный для воплощения фурсоны или другого антропоморфного персонажа. Может варьироваться от простых аксессуаров (уши, хвост) до полноценных костюмов с головой, лапами и механическими элементами. Используется на конвентах, фотосессиях и для развлечений."
    category: "артефакт"
    related_terms: ["фури", "фурсона", "костюм", "персонаж"]
    tags: ["костюм", "творчество", "ремесло", "воплощение", "персонаж"]
    updated: "2025-09-09"

  териан:
    definition: "Человек, который идентифицирует себя как имеющий душу или дух нечеловеческого животного"
    description: "Териантропия — это убеждение или ощущение, что человек обладает духом или душой нечеловеческого животного. Терианы часто испытывают фантомные конечности, ментальные сдвиги или другие явления, связанные с их животной идентичностью. Это духовная или психологическая идентичность, не связанная с физическими изменениями. Сообщество териан существует как онлайн, так и оффлайн, предоставляя поддержку и понимание для людей с подобным опытом."
    category: "идентичность"
    related_terms: ["озёркин", "квадробер", "шифтинг", "животная_идентичность", "духовная_териантропия"]
    tags: ["идентичность", "духовное", "животное", "психология", "сообщество"]
    updated: "2025-09-09"

  озёркин:
    definition: "Люди, которые идентифицируют себя как частично или полностью нечеловеческие существа"
    description: "Озёркин (Otherkin) — это люди, которые идентифицируют себя как существа, отличные от человека, включая мифических созданий, животных, растения, неорганические объекты или других сущностей. Эта идентичность обычно считается духовной или психологической, а не физической. Сообщество озёркин разнообразно и включает различные подкатегории в зависимости от типа идентичности."
    category: "идентичность"
    related_terms: ["териан", "фикшинкин", "альтерхуман", "драконкин", "эльфкин"]
    tags: ["идентичность", "духовное", "нечеловеческое", "сообщество", "мифология"]
    updated: "2025-09-09"

  фикшинкин:
    definition: "Люди, которые идентифицируют себя как вымышленные персонажи"
    description: "Фикшинкин — это подкатегория озёркин, где люди идентифицируют себя как персонажи из художественных произведений, игр, фильмов или других медиа. Это может включать как конкретных персонажей, так и виды или расы из вымышленных вселенных."
    category: "идентичность"
    related_terms: ["озёркин", "альтерхуман", "медиакин", "персонаж"]
    tags: ["идентичность", "вымышленное", "персонаж", "медиа", "фэндом"]
    updated: "2025-09-09"

  фурсона:
    definition: "Антропоморфный животный персонаж, который представляет человека в фэндоме фури"
    description: "Фурсона — это персонализированный животный персонаж, созданный участником сообщества фури. Она часто отражает аспекты личности создателя и служит аватаром или альтер эго в пространствах фури. Фурсона может иметь детализированную биографию, характер, внешний вид и историю. Многие используют фурсону для художественного творчества, ролевых игр и социального взаимодействия в сообществе."
    category: "интернет_культура"
    related_terms: ["фури", "антропоморфный", "аватар", "персонаж", "альтер_эго"]
    tags: ["персонаж", "идентичность", "искусство", "репрезентация", "творчество"]
    updated: "2025-09-09"

  антропоморфный:
    definition: "Наделение нечеловеческих существ человеческими характеристиками"
    description: "Антропоморфизм предполагает придание человеческих черт, эмоций, интеллекта или поведения животным, объектам или другим нечеловеческим сущностям. Это фундаментальная концепция в искусстве, литературе, мифологии и различных фэндомах. В современной культуре антропоморфные персонажи широко представлены в анимации, комиксах, играх и других медиа."
    category: "концепт"
    related_terms: ["фури", "фурсона", "персонификация", "зооморфизм"]
    tags: ["искусство", "литература", "концепция", "дизайн_персонажей", "мифология"]
    updated: "2025-09-09"

  шифтинг:
    definition: "Опыт ощущения себя в своей идентифицированной животной или нечеловеческой форме"
    description: "В сообществах териан и озёркин шифтинг означает переживание усиленной связи со своей животной или нечеловеческой идентичностью. Различают ментальный шифтинг (изменения в мышлении и восприятии), фантомный шифтинг (ощущение несуществующих конечностей), эмоциональный шифтинг и другие типы. Это субъективный опыт, который может варьироваться по интенсивности и продолжительности."
    category: "опыт"
    related_terms: ["териан", "озёркин", "ментальный_сдвиг", "фантомные_конечности"]
    tags: ["опыт", "психология", "идентичность", "феномен", "сознание"]
    updated: "2025-09-09"

  альтерхуман:
    definition: "Общий термин для людей, чья идентичность отличается от типичного человеческого опыта"
    description: "Альтерхуман — это широкий зонтичный термин, охватывающий различные нетипичные человеческие идентичности, включая териан, озёркин, плюральные системы, копилинки и других, кто переживает идентичность способами, отличающимися от стандартных концепций человеческой идентичности. Сообщество альтерхуман развивается как инклюзивное пространство для различных форм нечеловеческой идентичности."
    category: "идентичность"
    related_terms: ["териан", "озёркин", "плюральный", "нечеловеческий", "копилинк"]
    tags: ["общий_термин", "идентичность", "сообщество", "инклюзивность", "разнообразие"]
    updated: "2025-09-09"

  девочки_из_эквестрии:
    definition: "Пони предстают в человеческом облике"
    description: "Девочки из Эквестрии (Equestria Girls) — популярная франшиза студии Hasbro, являющаяся спин-оффом сериала 'Дружба — это чудо'. В этой версии главные героини-пони предстают как девочки-подростки в человеческом мире, сохраняя свои магические способности и личности. Франшиза включает мультфильмы, сериалы, игрушки и имеет активное русскоязычное фанатское сообщество."
    category: "медиа_франшиза"
    related_terms: ["эквестрия", "пони", "магия_дружбы", "сансет_шиммер", "твайлайт_спаркл"]
    tags: ["мультфильм", "франшиза", "магия", "дружба", "подростки", "фэндом"]
    updated: "2025-09-09"

  эквестрия:
    definition: "Вымышленный мир, где живут пони и другие магические существа"
    description: "Эквестрия — центральная локация вселенной My Little Pony, магическая страна, населенная пони различных видов, драконами и другими мифическими существами. В контексте Equestria Girls это параллельный мир, связанный с человеческим миром через магические порталы."
    category: "локация"
    related_terms: ["девочки_из_эквестрии", "магический_мир", "пони", "портал"]
    tags: ["мир", "локация", "магия", "фэнтези", "параллельная_вселенная"]
    updated: "2025-09-09"

  магия_дружбы:
    definition: "Центральная концепция вселенной о силе дружеских отношений"
    description: "Магия дружбы — это основополагающий элемент вселенной Эквестрии и Девочек из Эквестрии, представляющий идею о том, что искренние дружеские отношения обладают особой силой, способной преодолевать любые препятствия и побеждать зло. Эта концепция проходит через все произведения франшизы."
    category: "концепт"
    related_terms: ["дружба", "магия", "элементы_гармонии", "единороги"]
    tags: ["философия", "дружба", "магия", "гармония", "ценности"]
    updated: "2025-09-09"

  сансет_шиммер:
    definition: "Бывшая ученица принцессы Селестии, ставшая одной из главных героинь Equestria Girls"
    description: "Сансет Шиммер — единорог из Эквестрии, которая стала человеком и изначально была антагонистом в первом фильме Equestria Girls. После искупления стала одной из главных положительных героинь серии, представляя темы прощения и личного роста. Популярный персонаж среди русскоязычных фанатов."
    category: "персонаж"
    related_terms: ["девочки_из_эквестрии", "искупление", "единорог", "магия"]
    tags: ["персонаж", "развитие", "искупление", "магия", "лидерство"]
    updated: "2025-09-09"

  твайлайт_спаркл:
    definition: "Главная принцесса магии и дружбы"
    description: "Твайлайт Спаркл — единорог, ставший аликорном и принцессой Эквестрии. В версии Equestria Girls предстает как студентка, которая путешествует между мирами. Олицетворяет элемент магии и является центральным персонажем франшизы."
    category: "персонаж"
    related_terms: ["принцесса", "магия", "аликорн", "элементы_гармонии"]
    tags: ["главный_герой", "принцесса", "магия", "обучение", "лидерство"]
    updated: "2025-09-09"

  элементы_гармонии:
    definition: "Магические артефакты, воплощающие основные добродетели дружбы"
    description: "Элементы Гармонии — это шесть магических артефактов в мире Эквестрии, каждый из которых представляет определенную добродетель: Честность, Доброту, Щедрость, Верность, Смех и Магию. В Equestria Girls эти силы проявляются через дружеские отношения главных героинь."
    category: "артефакт"
    related_terms: ["магия_дружбы", "гармония", "добродетели"]
    tags: ["магия", "артефакт", "гармония", "добродетели", "сила"]
    updated: "2025-09-09"

  портал_в_эквестрию:
    definition: "Магический портал, соединяющий человеческий мир с миром пони"
    description: "Портал в Эквестрию — это магическая связь между двумя мирами в сюжете Equestria Girls, через которую персонажи могут путешествовать, трансформируясь при переходе из одной формы в другую."
    category: "локация"
    related_terms: ["эквестрия", "трансформация", "магия", "путешествие"]
    tags: ["портал", "магия", "трансформация", "путешествие", "связь"]
    updated: "2025-09-09"

  геод:
    definition: "Магические камни, дающие особые способности героиням Equestria Girls"
    description: "Геоды — это магические кристаллы в серии Equestria Girls, которые наделяют главных героинь особыми способностями в человеческом мире, позволяя им использовать магию дружбы в новых формах."
    category: "артефакт"
    related_terms: ["магия", "кристалл", "способности", "трансформация"]
    tags: ["магия", "артефакт", "сила", "кристалл", "трансформация"]
    updated: "2025-09-09"

  пониморф:
    definition: "Трансформированная форма персонажей Equestria Girls с чертами пони"
    description: "Пониморф — это особая форма, которую принимают героини Equestria Girls при использовании магии дружбы, сочетающая человеческие черты с характеристиками их пони-версий (уши, крылья, рога, хвосты)."
    category: "трансформация"
    related_terms: ["трансформация", "магия", "пони_черты", "геод"]
    tags: ["трансформация", "магия", "гибрид", "способности"]
    updated: "2025-09-09"

  брони:
    definition: "Взрослые поклонники франшизы Еквестрией"
    description: "Брони (от bro + pony) — это фанатское сообщество, состоящее преимущественно из подростков и взрослых людей, увлекающихся франшизой My Little Pony. В России брони-сообщество существует с начала 2010-х годов и включает активных создателей контента, организаторов мероприятий и просто зрителей."
    category: "фэндом"
    related_terms: ["my_little_pony", "фэндом", "сообщество", "девочки_из_эквестрии"]
    tags: ["фэндом", "сообщество", "взрослые_фаны", "субкультура"]
    updated: "2025-09-09"

  пегасистер:
    definition: "Девочки и женщины, увлекающиеся Еквестрией"
    description: "Пегасистер — термин для обозначения поклонниц Еквестрии женского пола, параллельный термину 'брони'. Образован от слов 'пегас' и 'сестра'."
    category: "фэндом"
    related_terms: ["брони", "my_little_pony", "фэндом", "поклонницы"]
    tags: ["фэндом", "женщины", "поклонники", "сообщество"]
    updated: "2025-09-09"

