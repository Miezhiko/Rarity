terms:
  квадробер:
    definition: "Человек, который передвигается на четырех конечностях и имитирует поведение животных"
    description: "Квадроберы — это люди, которые передвигаются на четвереньках и могут имитировать поведение животных. Это явление часто ассоциируется с различными интернет-субкультурами и формами самовыражения. В основном популярно среди подростков, которые имитируют поведение животных: рычат, совершают прыжки и носят аксессуары в виде масок, ушей и хвостов животных."
    category: "internet_culture"
    related_terms: ["фури", "териан", "озёркин"]
    tags: ["субкультура", "идентичность", "движение", "поведение"]
    updated: "2025-09-09"

  фури:
    definition: "Человек, интересующийся антропоморфными животными персонажами"
    description: "Фэндом фури (furry) — это субкультура, интересующаяся вымышленными антропоморфными персонажами с человеческими чертами и характеристиками. Участники часто создают фурсоны (fursonas) и занимаются различными формами художественного творчества."
    category: "internet_culture"
    related_terms: ["фурсона", "антропоморфный", "квадробер"]
    tags: ["фэндом", "субкультура", "искусство", "идентичность"]
    updated: "2025-09-09"

  териан:
    definition: "Человек, который идентифицирует себя как имеющий душу или дух нечеловеческого животного"
    description: "Териантропия — это убеждение, что человек обладает духом или душой нечеловеческого животного. Терианы часто испытывают фантомные конечности, ментальные сдвиги или другие явления, связанные с их животной идентичностью."
    category: "идентичность"
    related_terms: ["озёркин", "квадробер", "шифтинг"]
    tags: ["идентичность", "духовное", "животное", "психология"]
    updated: "2025-09-09"

  озёркин:
    definition: "Люди, которые идентифицируют себя как частично или полностью нечеловеческие существа"
    description: "Озёркин — это люди, которые идентифицируют себя как существа, отличные от человека, включая мифических созданий, животных или других сущностей. Эта идентичность обычно считается духовной или психологической, а не физической."
    category: "идентичность"
    related_terms: ["териан", "фикшинкин", "альтерхуман"]
    tags: ["идентичность", "духовное", "нечеловеческое", "сообщество"]
    updated: "2025-09-09"

  фурсона:
    definition: "Антропоморфный животный персонаж, который представляет человека в фэндоме фури"
    description: "Фурсона — это персонализированный животный персонаж, созданный участником сообщества фури. Она часто отражает аспекты личности создателя и служит аватаром или альтер эго в пространствах фури."
    category: "internet_culture"
    related_terms: ["фури", "антропоморфный", "аватар"]
    tags: ["персонаж", "идентичность", "искусство", "репрезентация"]
    updated: "2025-09-09"

  антропоморфный:
    definition: "Наделение нечеловеческих существ человеческими характеристиками"
    description: "Антропоморфизм предполагает придание человеческих черт, эмоций или поведения животным, объектам или другим нечеловеческим сущностям. Это распространено в искусстве, литературе и различных фэндомах."
    category: "концепт"
    related_terms: ["фури", "фурсона", "персонификация"]
    tags: ["искусство", "литература", "концепция", "дизайн_персонажей"]
    updated: "2025-09-09"

  шифтинг:
    definition: "Опыт ощущения себя в своей идентифицированной животной или нечеловеческой форме"
    description: "В сообществах териан и озёркин шифтинг означает переживание усиленной связи со своей животной или нечеловеческой идентичностью. Это может быть ментальным, фантомным (ощущение несуществующих конечностей) или поведенческим."
    category: "опыт"
    related_terms: ["териан", "озёркин", "ментальный_сдвиг"]
    tags: ["опыт", "психология", "идентичность", "феномен"]
    updated: "2025-09-09"

  альтерхуман:
    definition: "Общий термин для людей, чья идентичность отличается от типичного человеческого опыта"
    description: "Альтерхуман — это широкий термин, охватывающий различные нетипичные человеческие идентичности, включая териан, озёркин, плюральные системы и других, кто переживает идентичность способами, отличающимися от стандартных концепций человеческой идентичности."
    category: "идентичность"
    related_terms: ["териан", "озёркин", "плюральный", "нечеловеческий"]
    tags: ["общий_термин", "идентичность", "сообщество", "инклюзивность"]
    updated: "2025-09-09"

